[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rogerwilco"
version = "0.3.0"
description = "Program-run checks around an AI agent's irreversible actions: typed handoff lines, a readback the sender checks, and a done report checked against the plan."
readme = "rogerwilco/README.md"
license = "Apache-2.0"
license-files = ["rogerwilco/LICENSE", "rogerwilco/NOTICE"]
requires-python = ">=3.10"
authors = [{name = "Adam Field", email = "adam@crox.io"}]
keywords = ["ai-agents", "agents", "llm", "handoff", "readback", "guardrails", "multi-agent", "mcp", "payments", "protocol"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://rogerwilco.crox.io"
Documentation = "https://rogerwilco.crox.io/quickstart"
Research = "https://rogerwilco.crox.io/research"
Source = "https://github.com/afieldofdreams/rogerwilco"

[project.scripts]
rogerwilco = "rogerwilco.scripts.rogerwilco:main"

[tool.setuptools]
packages = ["rogerwilco", "rogerwilco.scripts"]

[tool.setuptools.package-data]
rogerwilco = ["profiles/*.json", "SKILL.md", "references/*.md", "tests/*", "NOTICE"]
